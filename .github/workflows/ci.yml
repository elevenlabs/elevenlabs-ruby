name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install

      - name: Run Rubocop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install

      - name: Run Tests
        run: |
          if [ ! -d test ]; then
            echo "::error::Expected generated tests under test/, found none."
            exit 1
          fi
          set +e
          test_output=$(bundle exec rake test 2>&1)
          test_status=$?
          set -e
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          runs=$(printf '%s\n' "$test_output" | grep -oE '[0-9]+ runs,' | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$runs" ]; then
            echo "::error::Could not parse Minitest's run count from rake test output."
            exit 1
          fi
          if [ "$runs" -eq 0 ]; then
            echo "::error::test/ exists but Minitest collected 0 runs."
            exit 1
          fi
          echo "Minitest ran $runs test(s)."

  publish:
    name: Publish to RubyGems.org
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Build gem
        run: bundle exec rake build

      - name: Push gem to RubyGems
        run: gem push pkg/*.gem
